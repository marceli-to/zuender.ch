title: Agenda
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: textarea
              required: true
              display: Titel
              validate:
                - required
          -
            handle: date_start
            field:
              type: date
              display: 'Datum von'
              width: 50
          -
            handle: date_end
            field:
              type: date
              display: 'Datum bis'
              width: 50
          -
            handle: type
            field:
              type: text
              display: Typ
              width: 50
          -
            handle: opening_hours
            field:
              type: text
              display: Öffnungszeiten
              width: 50
      -
        fields:
          -
            handle: blocks
            field:
              type: replicator
              display: Inhaltselemente
              collapse: true
              sets:
                main_elements:
                  display: 'Standard Elemente'
                  icon: package-box-crate
                  sets:
                    text:
                      display: Text
                      instructions: 'Text hinzufügen'
                      icon: text-formatting-initial-letter
                      fields:
                        -
                          import: editor
                    claim:
                      display: Claim
                      instructions: 'Claim hinzufügen'
                      icon: text-formatting-image-bottom
                      fields:
                        -
                          import: claim
                    links:
                      display: Links
                      instructions: 'Links hinzufügen'
                      icon: link
                      fields:
                        -
                          import: links
                    slideshow:
                      display: Slideshow
                      instructions: 'Bild-Slideshow hinzufügen'
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: slideshow
  teaser:
    display: Teaser
    sections:
      -
        fields:
          -
            handle: teaser_image
            field:
              type: group
              display: Bild
              fields:
                -
                  handle: image
                  field:
                    type: assets
                    display: Bild
                    container: assets
                    max_files: 1
                -
                  handle: caption
                  field:
                    type: textarea
                    display: Bildlegende
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
