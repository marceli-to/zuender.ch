title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: blocks
            field:
              type: replicator
              display: Inhaltselemente
              collapse: true
              sets:
                main_elements:
                  display: 'Standard Elemente'
                  icon: package-box-crate
                  sets:
                    intro:
                      display: Intro
                      instructions: 'Intro hinzufügen'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: intro
                    about:
                      display: 'Über uns'
                      instructions: 'Über uns hinzufügen'
                      icon: text-formatting-image-bottom
                      fields:
                        -
                          import: about
                    space:
                      display: Space
                      instructions: 'Space-Inhalt hinzufügen'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: space
                    contact:
                      display: Kontakt
                      instructions: 'Kontakt hinzufügen'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: contact
                    text:
                      display: 'Titel, Text'
                      instructions: 'Text hinzufügen'
                      icon: text-formatting-initial-letter
                      fields:
                        -
                          import: text
  settings:
    display: Settings
    sections:
      -
        display: 'New Section'
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
