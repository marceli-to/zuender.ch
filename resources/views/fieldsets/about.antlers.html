<section class="py-120 md:py-160 lg:py-240 md:px-20 flex flex-col justify-center md:border-b md:border-b-crimson dark:border-b-white">
  <div class="text-left md:text-center text-[1.125rem] md:text-[1.625rem] lg:text-[2.125rem] leading-[1.2] max-w-6xl mx-auto">
    <article class="[&_p:not(:last-of-type)]:mb-28 md:[&_p:not(:last-of-type)]:mb-42 lg:[&_p:not(:last-of-type)]:mb-56 text-pretty">
      {{ text }}
    </article>
  </div>
  {{ if links }}
    <div class="mx-auto flex flex-col md:flex-row items-center gap-32 md:gap-x-64 lg:gap-x-128 mt-72 md:mt-60">
      {{ links }}
        {{ url }}
          {{ partial:components/links/spring url="{url}" title="{title}" }}
        {{ /url }}
      {{ /links }}
    </div>
  {{ /if }}
</section>
