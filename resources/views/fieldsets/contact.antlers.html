<section class="flex flex-col justify-center md:border-b-1.5 md:border-b-crimson dark:border-b-white -ml-16 md:ml-0 -mr-16 md:mr-0">

  {{ if title }}
    <h1 aria-label="{{ title }}">
      {{ partial:components/headings/contact }}
    </h1>
  {{ /if }}

  <div class="px-16 my-64 md:my-96 lg:my-128">
    {{ if editor }}
      <article class="max-w-[75rem] mx-auto text-center text-sm md:text-2xl lg:text-4xl leading-[1.2] flex flex-col gap-y-32 lg:gap-y-48">
        {{ partial:fieldsets/editor :content="editor" }}
      </article>
    {{ /if }}
  </div>


</section>
