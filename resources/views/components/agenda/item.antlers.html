<a href="{{ url }}" class="block md:mx-16 lg:mx-24">

  {{ partial:components/agenda/header heading="h2" }}

  {{ if teaser_image }}
    <div class="mt-12 lg:mt-60 lg:mx-auto lg:max-w-[50rem]">
      {{ partial:components/media/image 
        :image="teaser_image:image" 
        :alt="teaser_image:caption" 
        preset="16x10"
        sizes="(min-width: 1024px) 50rem, 100vw"
        :captionClass="'text-center text-xxs md:text-xs mt-6 md:mt-12'" }}
    </div>
  {{ /if }}
</a>
