<head>
<meta charset="utf-8">
<script>(()=>{const s=localStorage.getItem('theme'),d=matchMedia('(prefers-color-scheme: dark)').matches,i=s==='dark'||(!s&&d);i&&document.documentElement.classList.add('dark');document.documentElement.style.colorScheme=i?'dark':'light'})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ if is_homepage }}<title>Zünder – Ort für kreative Explosionen</title>{{ else }}<title>{{ title }} – Zünder – Ort für kreative Explosionen</title>{{ /if }}
{{ if meta_description }}<meta name="description" content="{{ meta_description }}">{{ /if }}
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ current_url }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ current_url }}">
{{ if is_homepage }}<meta property="og:title" content="Zünder – Ort für kreative Explosionen">{{ else }}<meta property="og:title" content="{{ title }} – Zünder – Ort für kreative Explosionen">{{ /if }}
{{ if meta_description }}<meta property="og:description" content="{{ meta_description }}">{{ /if }}
<meta property="og:image" content="{{ config:app:url }}/opengraph.png">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Zünder" />
<link rel="manifest" href="/site.webmanifest" />
{{ vite src="resources/js/app.js|resources/css/app.css" }}
</head>
