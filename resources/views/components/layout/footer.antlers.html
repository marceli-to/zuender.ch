<div class="w-full max-w-page mx-auto">

  </div>
  <footer class="w-full pb-52 md:pb-80 mt-120 md:mt-0">

      {{ partial:components/logos/zuender }}
      {{ partial:components/logos/byline class="hidden md:block" }}
    </div>
    <div class="flex flex-col md:flex-row justify-between text-[1rem] leading-[1.28]">

        <div>
          <a

            class="text-crimson dark:text-white hover:opacity-60 transition-opacity">

      <div class="mb-52 md:mb-0 md:col-span-3 order-2 md:order-3">

      <div class="md:col-span-3 order-4">
        <nav>
          <ul class="flex flex-col gap-y-2">
            <li>
              <a 
                href="/kontakt" 
                class="text-crimson dark:text-white hover:text-crimson/60 dark:hover:text-white/60 transition-colors">

              </a>
            </li>
            <li>
