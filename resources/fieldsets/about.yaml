title: 'Über uns'
fields:
  -
    handle: text
    field:
      buttons:
        - bold
        - unorderedlist
        - removeformat
        - anchor
      toolbar_mode: floating
      link_collections:
        - pages
      container: assets
      collapse: true
      remove_empty_nodes: true
      type: bard
      display: Text
  -
    handle: links
    field:
      type: replicator
      display: Links
      sets:
        links:
          display: Links
          instructions: 'Links hinzufügen'
          icon: link
          sets:
            link:
              display: Link
              instructions: 'Link hinzufügen'
              icon: link
              fields:
                -
                  handle: url
                  field:
                    collections:
                      - pages
                    type: link
                    display: URL
