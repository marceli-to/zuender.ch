title: Editor
fields:
  -
    handle: editor
    field:
      type: bard
      display: Editor
      buttons:
        - h2
        - h3
        - bold
        - unorderedlist
        - removeformat
        - anchor
      toolbar_mode: floating
      link_collections:
        - pages
      container: assets
      remove_empty_nodes: true
      collapse: true
      sets:
        main:
          display: Main
          sets:
            button:
              display: Button
              instructions: 'Button hinzufügen'
              icon: link
              fields:
                -
                  handle: url
                  field:
                    type: link
                    display: URL
                    collections:
                      - pages
                    container: assets
                -
                  handle: title
                  field:
                    type: text
                    display: Titel
                -
                  handle: target
                  field:
                    type: select
                    display: Target
                    default: _self
                    options:
                      _self: 'Gleiches Fenster'
                      _blank: 'Neues Fenster'
