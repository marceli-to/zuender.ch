title: Slideshow
fields:
  -
    handle: slides
    field:
      type: replicator
      display: Slideshow
      sets:
        slides:
          display: Slideshow
          instructions: 'Bilder hinzufügen'
          icon: media-image-picture-gallery
          sets:
            slide:
              display: Bild
              instructions: 'Bild hinzufügen'
              icon: media-image-picture-gallery
              fields:
                -
                  handle: image
